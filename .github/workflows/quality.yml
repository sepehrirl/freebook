name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Check configuration template syntax
        run: node --check config.js
      - name: Verify required product files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s config.js
          test -s supabase/migrations/001_initial_schema.sql
